[/Script/EngineSettings.GameMapsSettings]
; Code-only project: we boot into the engine's empty Entry map and the C++
; game mode constructs the whole scene at runtime.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/UmbraVale.SnakeGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Lumen requires DX12 + Shader Model 6.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen global illumination + reflections: the signature Unreal look.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.AntiAliasingMethod=4
; Volumetric fog is the scene's signature look but its froxel grid is the
; heaviest per-frame pass here; a coarser grid is visually identical for fog
; this soft and costs a fraction as much.
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum
