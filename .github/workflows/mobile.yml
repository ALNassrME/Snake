name: Mobile builds

# Produces the installable Android artifacts on every push, and the iOS
# artifacts on demand. Signing material is optional: without secrets the jobs
# still build (unsigned) so the pipeline is always verifiable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build the iOS archive (uses a macOS runner)'
        type: boolean
        default: true

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured — the release APK will be unsigned." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Report artifact sizes
        run: |
          echo "### Android artifacts" >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
            printf -- '- `%s` — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umbra-vale-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB (Play Store upload format)
        uses: actions/upload-artifact@v4
        with:
          name: umbra-vale-android-aab
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    name: iOS (IPA)
    # Only iOS needs a macOS runner; skip it on pull requests to save minutes.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Import signing certificate
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured — building an unsigned archive." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d \
              > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      # Without credentials we still compile and archive, which proves the
      # iOS project is valid. The result is not installable on a device.
      - name: Build unsigned archive
        if: steps.signing.outputs.signed != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/App.xcarchive/Products/Applications"
          mkdir -p Payload && cp -R App.app Payload/
          zip -qry "$RUNNER_TEMP/ipa/UmbraVale-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: umbra-vale-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

  release:
    name: Publish downloads
    needs: [android, ios]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Workflow artifacts expire and require a GitHub login to fetch. A
      # release gives permanent, public, direct download links instead.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          find artifacts -name '*.apk' -o -name '*.aab' -o -name '*.ipa' | while read -r f; do
            case "$f" in
              *release-unsigned.apk|*release.apk) cp "$f" downloads/UmbraVale-release.apk ;;
              *debug.apk)                         cp "$f" downloads/UmbraVale-debug.apk ;;
              *.aab)                              cp "$f" downloads/UmbraVale.aab ;;
              *.ipa)                              cp "$f" downloads/UmbraVale.ipa ;;
            esac
          done
          ls -la downloads

          NOTES=$(cat <<'MD'
          Automated build of **Umbra Vale** from the latest `main`.

          | File | Use |
          | --- | --- |
          | `UmbraVale-debug.apk` | **Install this to play on Android now** — debug-signed, works on any device |
          | `UmbraVale-release.apk` | Release build; unsigned unless signing secrets are configured |
          | `UmbraVale.aab` | Google Play upload format |
          | `UmbraVale.ipa` | iOS; installable only when built with an Apple Developer certificate |

          Android may warn about installing from an unknown source — that is expected for
          a directly distributed APK.
          MD
          )

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest downloads/* \
            --title "Umbra Vale — latest build" \
            --notes "$NOTES" \
            --latest
