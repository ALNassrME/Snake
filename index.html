<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="description" content="Umbra Vale — a hand-painted dark fantasy snake odyssey. Guide the last emberwyrm through the dusk-lit vale." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Umbra Vale</title>
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('./fonts/cinzel-500.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cinzel';
        src: url('./fonts/cinzel-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Spectral';
        src: url('./fonts/spectral-400.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Spectral';
        src: url('./fonts/spectral-400-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Spectral';
        src: url('./fonts/spectral-500.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
    </style>
    <style>
      /* Boot loader — inlined so it paints before any JS loads */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root { position: fixed; inset: 0; }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at 50% 42%, #131a28 0%, #0a0d14 62%, #06080d 100%);
        z-index: 1000;
        transition: opacity 0.9s ease;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #boot-loader.boot-done { opacity: 0; pointer-events: none; }
      .boot-sigil {
        width: 84px;
        height: 84px;
        animation: boot-breathe 2.6s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(122, 216, 196, 0.35));
      }
      .boot-title {
        color: #cfd8cd;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        font-size: 15px;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .boot-bar {
        width: 220px;
        height: 2px;
        background: rgba(160, 190, 180, 0.14);
        border-radius: 2px;
        overflow: hidden;
      }
      .boot-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #7ad8c4, transparent);
        animation: boot-sweep 1.4s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader" aria-label="Loading Umbra Vale">
      <svg class="boot-sigil" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#7ad8c4" stroke-width="1.5" opacity="0.5" />
        <circle cx="50" cy="50" r="34" fill="none" stroke="#7ad8c4" stroke-width="0.8" opacity="0.3" />
        <path d="M50 18 C 66 30, 66 44, 50 52 C 34 60, 34 72, 50 82" fill="none" stroke="#a8e8d8" stroke-width="3" stroke-linecap="round" />
        <circle cx="50" cy="18" r="4" fill="#d8f5ec" />
      </svg>
      <div class="boot-title">Umbra Vale</div>
      <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
